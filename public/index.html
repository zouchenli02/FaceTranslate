<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f7f2"><title>同声 · FaceTranslate</title><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main class="shell">
<header><a class="brand" href="/">同声<span>FACE TRANSLATE</span></a><span id="mode" class="badge">连接中</span></header>
<section class="intro"><p class="eyebrow">LESS DISTANCE. MORE UNDERSTANDING.</p><h1>语言不同，<br>也能好好聊。</h1><p>把手机放在你们之间，让对话自然发生。</p></section>
<section class="workspace" aria-label="面对面翻译">
<div class="toolbar"><span><i></i> 面对面对话</span><button id="flip" aria-pressed="false">⇅ 对面阅读</button></div>
<div id="partner" class="partner"><span class="eyebrow">FOR YOUR PARTNER</span><p id="partnerText">Hello. Let's talk.</p><span id="partnerHint">对方的译文会显示在这里</span></div>
<div class="languagebar"><label>我说<select id="myLanguage" aria-label="我的语言"><option value="zh-Hans">中文 · 普通话</option><option value="en">English</option></select></label><span>⇄</span><label>对方说<strong id="otherLanguage">English</strong></label></div>
<div id="history" class="history" role="log" aria-label="对话记录"><div id="empty" class="empty"><span>◌</span><h2>从一句「你好」开始</h2><p>点击下方按钮说话，或输入文字。<br>一次一人，说完后会为对方翻译。</p></div></div>
<div class="composer"><div id="status" role="status" aria-live="polite">准备好了</div><textarea id="input" rows="2" maxlength="2000" aria-label="输入或修改待翻译内容" placeholder="也可以输入文字，或修改识别结果…"></textarea><div class="inputActions"><label>发言人<select id="speaker"><option value="me">我</option><option value="other">对方</option></select></label><button id="translate" class="primary">翻译文字 ↗</button></div><div class="talkButtons"><button id="talkMe">● 我来说 <small>中文</small></button><button id="talkOther">● 对方说 <small>English</small></button></div><div class="options"><label><input type="checkbox" id="autoPlay" checked> 自动播报</label><button id="stopAudio">停止播报</button><button id="clear">清空对话</button></div></div>
</section><section class="examples"><div><h2>试着聊一句</h2><span id="exampleHint">示例对话</span></div><div id="examples"></div></section><footer>对话仅保留在当前页面 · 关闭后不保存<p>语音识别可能由浏览器的云服务处理；文字翻译会发送到配置的翻译服务。</p></footer>
</main></body></html>
